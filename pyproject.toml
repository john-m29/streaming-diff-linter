[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "difflint"
version = "0.1.0"
description = "A linter that checks the lines a diff adds, streamed so it never loads the whole patch into memory"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "john-m29"}]

[project.scripts]
difflint = "difflint.__main__:main"

[tool.setuptools.packages.find]
include = ["difflint*"]
